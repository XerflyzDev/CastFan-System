name: Test and deploy to Google Cloud

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test with H2 and MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: castfan
          MYSQL_USER: castfan
          MYSQL_PASSWORD: castfan_test
          MYSQL_ROOT_PASSWORD: castfan_root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=castfan_root_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      CASTFAN_MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/castfan
      CASTFAN_MYSQL_TEST_USERNAME: castfan
      CASTFAN_MYSQL_TEST_PASSWORD: castfan_test
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run test suite
        run: ./mvnw --batch-mode test

  deploy:
    name: Build and deploy Cloud Run revision
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: castfan-cloud-run-production
      cancel-in-progress: false
    env:
      PROJECT_ID: castfan-system
      REGION: asia-southeast1
      SERVICE: castfan
      IMAGE: asia-southeast1-docker.pkg.dev/castfan-system/castfan-images/castfan-app
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/473125501009/locations/global/workloadIdentityPools/github-actions/providers/castfan-github
          service_account: castfan-deployer@castfan-system.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Authorize Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Cloud Run revision
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          flags: >-
            --project=${{ env.PROJECT_ID }}
            --service-account=castfan-runtime@castfan-system.iam.gserviceaccount.com
            --min=0
            --max=2
            --allow-unauthenticated

      - name: Verify deployed health
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "${SERVICE_URL}/actuator/health" | grep -q '"status":"UP"'; then
              echo "Cloud Run health check passed."
              exit 0
            fi
            echo "Health check attempt ${attempt} failed; retrying in 10 seconds."
            sleep 10
          done
          echo "Cloud Run health check did not become healthy in time."
          exit 1
