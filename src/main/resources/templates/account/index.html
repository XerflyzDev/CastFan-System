<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Manage your CastFan account.">
    <title>Account | CastFan</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="auth-page">
<main class="auth-layout">
    <a class="brand auth-brand" th:href="@{/}" aria-label="CastFan home">
        <span class="brand-mark" aria-hidden="true"><i class="bi bi-heart-fill"></i></span>
        <span>CastFan</span>
    </a>

    <section class="auth-panel" aria-labelledby="account-heading">
        <div class="account-avatar" aria-hidden="true"><i class="bi bi-person-fill"></i></div>
        <div class="auth-heading account-heading">
            <p class="eyebrow" th:text="${account.role}">MEMBER</p>
            <h1 id="account-heading" th:text="${account.displayName}">Member</h1>
            <p th:text="${account.email}">member@example.com</p>
        </div>

        <div class="account-actions">
            <a class="secondary-button" th:if="${account.role == 'MEMBER'}" th:href="@{/}">Open Member home</a>
            <a class="secondary-button" th:if="${account.role == 'CAST'}" th:href="@{/cast}">Open Cast workspace</a>
            <a class="secondary-button" th:if="${account.role == 'OWNER'}" th:href="@{/owner}">Open Owner workspace</a>
            <form th:action="@{/logout}" method="post">
                <button class="primary-button" type="submit">Sign out</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
