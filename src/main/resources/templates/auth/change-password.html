<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Change password | CastFan</title><link th:href="@{/css/app.css}" rel="stylesheet"></head><body class="auth-page"><main class="auth-layout"><section class="auth-panel"><h1>Create your password</h1><p>Your temporary password must be replaced before you can use CastFan.</p><div class="form-alert" th:if="${error}" th:text="${error}"></div><form class="auth-form" th:action="@{/account/change-password}" method="post"><label class="form-field"><span class="field-label">New password</span><input name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required></label><label class="form-field"><span class="field-label">Confirm password</span><input name="confirmPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required></label><button class="primary-button auth-submit" type="submit">Save password</button></form></section></main></body></html>
