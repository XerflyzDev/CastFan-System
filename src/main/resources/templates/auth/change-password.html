<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Replace your temporary CastFan password.">
    <title>Create Your Password | CastFan</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/ui-foundation.css}" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <link th:href="@{/css/multi-store.css}" rel="stylesheet">
    <script th:src="@{/js/auth.js}" defer></script>
</head>
<body class="auth-page">
<main class="auth-layout auth-layout-signup password-change-layout">
    <div class="auth-atmosphere" aria-hidden="true"></div>
    <header class="auth-topbar auth-topbar-centered"><span class="auth-wordmark">CastFan</span></header>
    <section class="auth-panel auth-login-panel auth-signup-panel password-change-panel" aria-labelledby="password-change-heading">
        <div class="auth-login-heading password-change-heading">
            <h1 id="password-change-heading">Create your password</h1>
            <p>Replace the temporary password from your Store Owner before continuing to CastFan.</p>
        </div>
        <div class="form-alert" th:if="${error}"><i class="bi bi-exclamation-circle" aria-hidden="true"></i><span th:text="${error}">Unable to update password.</span></div>
        <form class="auth-form" th:action="@{/account/change-password}" method="post">
            <label class="form-field">
                <span class="field-label">New password</span>
                <span class="auth-input"><i class="bi bi-lock" aria-hidden="true"></i><input id="password" name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required placeholder="8–72 characters"></span>
                <span class="password-strength" data-password-strength hidden>
                    <span class="password-strength-heading"><span data-password-strength-help>Use 8 to 72 characters.</span><strong data-password-strength-label>Not rated</strong></span>
                    <span class="password-strength-meter" aria-hidden="true"><span></span><span></span><span></span></span>
                </span>
            </label>
            <label class="form-field">
                <span class="field-label">Confirm password</span>
                <span class="auth-input"><i class="bi bi-shield-check" aria-hidden="true"></i><input name="confirmPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required placeholder="Enter the password again"></span>
            </label>
            <button class="primary-button auth-submit" type="submit"><span>Save password</span><i class="bi bi-arrow-right" aria-hidden="true"></i></button>
        </form>
        <p class="password-security-note"><i class="bi bi-lock" aria-hidden="true"></i>Your Store Owner cannot view your password.</p>
    </section>
</main>
</body>
</html>
