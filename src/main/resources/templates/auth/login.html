<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Sign in to your CastFan account.">
    <title>Sign in | CastFan</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="auth-page">
<main class="auth-layout">
    <a class="brand auth-brand" th:href="@{/}" aria-label="CastFan home">
        <span class="brand-mark" aria-hidden="true"><i class="bi bi-heart-fill"></i></span>
        <span>CastFan</span>
    </a>

    <section class="auth-panel" aria-labelledby="login-heading">
        <div class="auth-heading">
            <p class="eyebrow">Welcome back</p>
            <h1 id="login-heading">Sign in</h1>
            <p>Continue to your CastFan account.</p>
        </div>

        <div class="form-alert success" th:if="${param.registered}" role="status">
            Your account is ready. Sign in to continue.
        </div>
        <div class="form-alert" th:if="${param.error}" role="alert">
            Invalid email or password.
        </div>
        <div class="form-alert neutral" th:if="${param.logout}" role="status">
            You have signed out.
        </div>

        <form class="auth-form" th:action="@{/login}" method="post">
            <label class="form-field" for="email">
                <span>Email</span>
                <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required autofocus>
            </label>
            <label class="form-field" for="password">
                <span>Password</span>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </label>
            <button class="primary-button" type="submit">Sign in</button>
        </form>

        <p class="auth-switch">New to CastFan? <a th:href="@{/signup}">Create an account</a></p>
    </section>
</main>
</body>
</html>
