<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Create a CastFan Member account.">
    <title>Create account | CastFan</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <script th:src="@{/js/auth.js}" defer></script>
</head>
<body class="auth-page">
<main class="auth-layout auth-layout-signup">
    <div class="auth-atmosphere" aria-hidden="true"></div>
    <header class="auth-topbar auth-topbar-centered">
        <a class="auth-wordmark" th:href="@{/}" aria-label="CastFan home">CastFan</a>
    </header>

    <section class="auth-panel auth-login-panel auth-signup-panel" aria-labelledby="signup-heading">
        <div class="auth-login-heading">
            <h1 id="signup-heading">Create your account</h1>
            <p>Join CastFan as a Member.</p>
        </div>

        <div class="auth-social-mock" th:if="${showGoogleLoginMock}">
            <button class="auth-google-button" type="button" data-google-login-mock aria-describedby="google-login-status">
                <span class="google-mark" aria-hidden="true">G</span>
                <span>Continue with Google</span>
                <small>Mockup</small>
            </button>
            <p id="google-login-status" class="auth-mock-status" role="status" hidden>Google sign-up is a visual preview and is not connected yet.</p>
            <div class="auth-divider"><span>or use email</span></div>
        </div>

        <form class="auth-form" th:action="@{/signup}" th:object="${form}" method="post" novalidate>
            <label class="form-field" for="displayName">
                <span class="field-label">Display name</span>
                <span class="auth-input"><i class="bi bi-person" aria-hidden="true"></i><input id="displayName" type="text" th:field="*{displayName}" autocomplete="name" minlength="3" maxlength="80" placeholder="How should we call you?" aria-describedby="display-name-hint" th:classappend="${#fields.hasErrors('displayName')} ? 'is-invalid'" required autofocus></span>
                <small id="display-name-hint" class="field-hint live-field-hint" data-name-validation>Use at least 3 characters.</small>
                <small class="field-error" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}">Display name error</small>
            </label>
            <label class="form-field" for="email">
                <span class="field-label">Email</span>
                <span class="auth-input"><i class="bi bi-envelope" aria-hidden="true"></i><input id="email" type="email" inputmode="email" th:field="*{email}" autocomplete="email" maxlength="254" placeholder="you@example.com" aria-describedby="signup-email-hint" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" required></span>
                <small id="signup-email-hint" class="field-hint live-field-hint" data-email-validation>Enter an email such as name@example.com.</small>
                <small class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</small>
            </label>
            <label class="form-field" for="password">
                <span class="field-label">Password</span>
                <span class="auth-input"><i class="bi bi-lock" aria-hidden="true"></i><input id="password" type="password" th:field="*{password}" autocomplete="new-password" minlength="8" maxlength="72" placeholder="Create a secure password" aria-describedby="password-strength-help" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" required></span>
                <div class="password-strength" data-password-strength role="status" aria-live="polite" hidden>
                    <div class="password-strength-heading"><span>Password strength</span><strong data-password-strength-label>Not rated</strong></div>
                    <div class="password-strength-meter" aria-hidden="true"><span></span><span></span><span></span></div>
                    <small id="password-strength-help" data-password-strength-help>Use 8 to 72 characters.</small>
                </div>
                <small class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</small>
            </label>
            <label class="form-field" for="confirmPassword">
                <span class="field-label">Confirm password</span>
                <span class="auth-input"><i class="bi bi-shield-lock" aria-hidden="true"></i><input id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password" maxlength="72" placeholder="Enter it once more" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'" required></span>
                <small class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Confirmation error</small>
            </label>
            <button class="primary-button auth-submit" type="submit"><span>Create account</span><i class="bi bi-arrow-right" aria-hidden="true"></i></button>
        </form>

        <p class="auth-switch">Already have an account? <a th:href="@{/login}">Sign in</a></p>
        <p class="auth-footnote"><i class="bi bi-shield-check" aria-hidden="true"></i><span>Your password is securely encrypted.</span></p>
    </section>
</main>
</body>
</html>
