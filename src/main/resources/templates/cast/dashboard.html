<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Manage your Cast profile, shifts, and content.">
    <title>Cast Dashboard | CastFan</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/ui-foundation.css}" rel="stylesheet">
    <link th:href="@{/css/member-home.css}" rel="stylesheet">
    <link th:href="@{/css/cast-workspace.css}" rel="stylesheet">
</head>
<body>
<main class="concept-stage">
    <section class="phone" aria-label="Cast dashboard">
        <div class="ambient-top" aria-hidden="true"></div>
        <div class="screen-content cast-content">
            <div class="top-actions">
                <a class="wordmark" th:href="@{/cast}">CastFan</a>
            </div>

            <header class="cast-heading">
                <p th:text="${workspace.assignments.empty ? 'Welcome back' : workspace.assignments.getFirst().storeName}">Welcome back</p>
                <h1 th:text="${workspace.profile.stageName}">Mina</h1>
            </header>

            <div class="cast-stats" aria-label="Cast summary">
                <div><span><i class="bi bi-clock" aria-hidden="true"></i></span><strong th:text="${workspace.pendingCount}">0</strong><small>Pending shifts</small></div>
                <div><span class="lavender"><i class="bi bi-people" aria-hidden="true"></i></span><strong th:text="${workspace.profile.followerCount}">0</strong><small>Followers</small></div>
            </div>

            <section class="cast-section" aria-labelledby="next-shifts-heading">
                <div class="section-title">
                    <div><small>Next approved</small><h2 id="next-shifts-heading" th:text="${workspace.nextShiftLabel}">No approved shift</h2></div>
                    <a th:href="@{/cast/schedule}" aria-label="Open schedule"><i class="bi bi-arrow-right" aria-hidden="true"></i></a>
                </div>
                <div class="cast-shift-list" th:if="${!workspace.shifts.empty}">
                    <article class="cast-shift-row" th:each="shift : ${workspace.shifts}">
                        <div class="shift-date"><strong th:text="${shift.dateLabel}">15 Oct</strong><small th:text="${shift.dayLabel}">Wednesday</small></div>
                        <div class="shift-main"><strong th:text="${shift.storeName}">CastFan</strong><small th:text="${shift.timeLabel}">14:00 - 20:00</small></div>
                        <span class="shift-badge" th:classappend="${shift.statusTone}" th:text="${shift.workingNow ? 'Working' : shift.status}">Approved</span>
                    </article>
                </div>
                <div class="cast-empty" th:if="${workspace.shifts.empty}"><i class="bi bi-calendar2-plus" aria-hidden="true"></i><div><strong>No upcoming shifts</strong><small>Submit availability for Owner review.</small></div></div>
            </section>

            <div class="dashboard-actions"><a class="secondary-action" th:href="@{/cast/schedule}"><i class="bi bi-calendar-plus" aria-hidden="true"></i><span>Request shift</span></a></div>
        </div>

        <nav th:replace="~{fragments/navigation :: cast('cast')}"></nav>
    </section>
</main>
<script th:src="@{/js/cast-workspace.js}" defer></script>
</body>
</html>
