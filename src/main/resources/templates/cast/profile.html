<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Edit your public Cast profile.">
    <title>Cast Profile Settings | CastFan</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/member-home.css}" rel="stylesheet">
    <link th:href="@{/css/cast-workspace.css}" rel="stylesheet">
</head>
<body>
<main class="concept-stage">
    <section class="phone" aria-label="Cast profile settings">
        <div class="ambient-top" aria-hidden="true"></div>
        <header class="status-bar" aria-label="Local time"><strong id="local-time">--:--</strong><span class="store-status"><i class="bi bi-person-check" aria-hidden="true"></i>Profile settings</span></header>
        <div class="screen-content cast-content">
            <div class="top-actions"><a class="wordmark" th:href="@{/cast}">CastFan</a><a class="round-button" th:href="@{/casts/{id}(id=${workspace.profile.id})}" aria-label="Preview public profile" title="Preview public profile"><i class="bi bi-eye" aria-hidden="true"></i></a></div>
            <header class="cast-heading"><p>Public presence</p><h1>Your profile</h1></header>

            <div class="inline-alert success" th:if="${param.saved}" role="status"><i class="bi bi-check-circle" aria-hidden="true"></i>Profile saved.</div>

            <section class="profile-preview" aria-label="Profile preview">
                <img th:if="${workspace.profile.avatarUrl != null}" th:src="${workspace.profile.avatarUrl}" th:alt="${workspace.profile.stageName}">
                <span class="cast-avatar large" th:unless="${workspace.profile.avatarUrl != null}" th:text="${workspace.profile.initials}">MN</span>
                <div><strong th:text="${workspace.profile.stageName}">Mina</strong><small><span th:text="${workspace.profile.followerCount}">0</span> followers · <span th:text="${workspace.profile.discoverable ? 'Visible' : 'Hidden'}">Visible</span></small></div>
            </section>

            <section class="form-card profile-form-card" aria-labelledby="edit-profile-heading">
                <div class="card-heading"><div><small>Public information</small><h2 id="edit-profile-heading">Edit profile</h2></div><span><i class="bi bi-pencil" aria-hidden="true"></i></span></div>
                <form class="cast-form" th:action="@{/cast/profile}" th:object="${form}" method="post">
                    <div class="inline-alert error" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}">Profile error</div>
                    <label><span>Stage name</span><input type="text" th:field="*{stageName}" maxlength="80" required><small class="field-error" th:if="${#fields.hasErrors('stageName')}" th:errors="*{stageName}">Name error</small></label>
                    <label><span>Bio</span><textarea th:field="*{bio}" maxlength="1000" rows="4" placeholder="Tell Members a little about you"></textarea><small class="field-error" th:if="${#fields.hasErrors('bio')}" th:errors="*{bio}">Bio error</small></label>
                    <label><span>Avatar URL</span><input type="url" th:field="*{avatarUrl}" maxlength="2048" placeholder="https://example.com/photo.jpg"><small class="field-error" th:if="${#fields.hasErrors('avatarUrl')}" th:errors="*{avatarUrl}">Avatar error</small></label>
                    <label class="toggle-row"><span><strong>Discoverable profile</strong><small>Allow Members to find and follow you.</small></span><input type="checkbox" th:field="*{discoverable}"><i aria-hidden="true"></i></label>
                    <button class="primary-action form-submit" type="submit"><i class="bi bi-check2" aria-hidden="true"></i><span>Save profile</span></button>
                </form>
            </section>

            <section class="account-card" aria-label="Account details"><span><i class="bi bi-envelope" aria-hidden="true"></i></span><div><strong>Account email</strong><small th:text="${workspace.profile.email}">cast@example.com</small></div></section>
            <form th:action="@{/logout}" method="post"><button class="sign-out-action" type="submit"><i class="bi bi-box-arrow-right" aria-hidden="true"></i>Sign out</button></form>
        </div>

        <nav class="floating-nav" aria-label="Cast navigation">
            <a class="nav-button" th:href="@{/cast}"><i class="bi bi-grid"></i><span>Dashboard</span></a>
            <a class="nav-button" th:href="@{/cast/schedule}"><i class="bi bi-calendar3"></i><span>Schedule</span></a>
            <a class="nav-button" th:href="@{/cast/tiers}"><i class="bi bi-stars"></i><span>Tiers</span></a>
            <a class="nav-button active" th:href="@{/cast/profile}" aria-current="page"><i class="bi bi-person-fill"></i><span>Profile</span></a>
        </nav>
    </section>
</main>
<script th:src="@{/js/cast-workspace.js}" defer></script>
</body>
</html>
