<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Manage Cast membership tiers.">
    <title>Membership Tiers | CastFan</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/member-home.css}" rel="stylesheet">
    <link th:href="@{/css/cast-workspace.css}" rel="stylesheet">
</head>
<body>
<main class="concept-stage">
    <section class="phone" aria-label="Cast membership tiers">
        <div class="ambient-top" aria-hidden="true"></div>
        <div class="screen-content cast-content">
            <div class="top-actions"><a class="wordmark" th:href="@{/cast}">CastFan</a><a class="round-button" th:href="@{/cast}" aria-label="Back to dashboard" title="Dashboard"><i class="bi bi-grid" aria-hidden="true"></i></a></div>
            <header class="cast-heading"><p>Member access</p><h1>Your tiers</h1></header>

            <div class="inline-alert success" th:if="${param.created}" role="status"><i class="bi bi-check-circle" aria-hidden="true"></i>Membership tier created.</div>
            <div class="inline-alert neutral" th:if="${param.deactivated}" role="status"><i class="bi bi-info-circle" aria-hidden="true"></i>Membership tier deactivated.</div>

            <section class="cast-section tier-section" aria-labelledby="current-tier-heading">
                <div class="section-title"><div><small>Current setup</small><h2 id="current-tier-heading">Membership tiers</h2></div><span class="count-pill" th:text="${tiers.size()}">0</span></div>
                <div class="mobile-tier-list" th:if="${!tiers.empty}">
                    <article class="mobile-tier-row" th:each="tier : ${tiers}">
                        <span class="tier-rank" th:text="${tier.rank}">1</span>
                        <div><span class="tier-title"><strong th:text="${tier.name}">Silver</strong><small th:classappend="${!tier.active} ? ' inactive'" th:text="${tier.active ? 'Active' : 'Inactive'}">Active</small></span><p th:text="${tier.description != null ? tier.description : 'No description.'}">Description</p><b><span th:text="${#numbers.formatDecimal(tier.monthlyPrice, 1, 2)}">199.00</span> THB / month</b></div>
                        <form th:if="${tier.active}" th:action="@{/cast/tiers/{id}/deactivate(id=${tier.id})}" method="post" data-confirm="Deactivate this membership tier?"><button class="row-action" type="submit" aria-label="Deactivate tier" title="Deactivate tier"><i class="bi bi-archive" aria-hidden="true"></i></button></form>
                    </article>
                </div>
                <div class="cast-empty" th:if="${tiers.empty}"><i class="bi bi-stars" aria-hidden="true"></i><div><strong>No membership tiers</strong><small>Create your first tier for Member access.</small></div></div>
            </section>

            <section class="form-card" aria-labelledby="create-tier-heading">
                <div class="card-heading"><div><small>New membership</small><h2 id="create-tier-heading">Create a tier</h2></div><span><i class="bi bi-plus-lg" aria-hidden="true"></i></span></div>
                <form class="cast-form" th:action="@{/cast/tiers}" th:object="${form}" method="post">
                    <div class="inline-alert error" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}">Tier conflict</div>
                    <label><span>Name</span><input type="text" th:field="*{name}" maxlength="80" required placeholder="Silver Member"><small class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</small></label>
                    <label><span>Description</span><textarea th:field="*{description}" maxlength="500" rows="3" placeholder="Benefits included in this tier"></textarea><small class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Description error</small></label>
                    <div class="form-pair"><label><span>Rank</span><input type="number" th:field="*{rank}" min="1" max="100" required><small class="field-error" th:if="${#fields.hasErrors('rank')}" th:errors="*{rank}">Rank error</small></label><label><span>Monthly THB</span><input type="number" th:field="*{monthlyPrice}" min="0" max="99999999.99" step="0.01" required><small class="field-error" th:if="${#fields.hasErrors('monthlyPrice')}" th:errors="*{monthlyPrice}">Price error</small></label></div>
                    <button class="primary-action form-submit" type="submit"><i class="bi bi-plus-lg" aria-hidden="true"></i><span>Create tier</span></button>
                </form>
            </section>
        </div>

        <nav th:replace="~{fragments/navigation :: cast('cast')}"></nav>
    </section>
</main>
<script th:src="@{/js/cast-workspace.js}" defer></script>
<script th:src="@{/js/confirmation-dialog.js}" defer></script>
</body>
</html>
