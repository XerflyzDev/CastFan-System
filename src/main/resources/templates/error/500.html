<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="CastFan could not complete this request.">
    <meta name="robots" content="noindex">
    <title>Something went wrong | CastFan</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/ui-foundation.css}" rel="stylesheet">
    <link th:href="@{/css/member-home.css}" rel="stylesheet">
    <link th:href="@{/css/error-pages.css}" rel="stylesheet">
</head>
<body>
<main class="concept-stage">
    <section class="phone error-phone" aria-label="Server error">
        <div class="ambient-top" aria-hidden="true"></div>
        <div class="screen-content error-content">
            <div class="top-actions"><a class="wordmark" th:href="@{/}">CastFan</a></div>
            <section class="error-state" aria-labelledby="server-error-heading">
                <span class="error-code" aria-hidden="true">500</span>
                <div class="error-copy">
                    <p>Temporary issue</p>
                    <h1 id="server-error-heading">We could not finish that</h1>
                    <span>Try again in a moment. If no confirmation appeared, no action was completed.</span>
                </div>
                <div class="error-actions">
                    <a class="error-primary" th:href="@{/}">Back to home</a>
                </div>
            </section>
        </div>
    </section>
</main>
</body>
</html>
