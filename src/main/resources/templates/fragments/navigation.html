<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="anonymous(active)" class="floating-nav" aria-label="Primary navigation">
    <a class="nav-button" th:classappend="${active == 'home' ? ' active' : ''}" th:href="@{/}" aria-label="Home" title="Home" th:attr="aria-current=${active == 'home' ? 'page' : null}"><i class="bi" th:classappend="${active == 'home' ? 'bi-house-fill' : 'bi-house'}" aria-hidden="true"></i><span>Home</span></a>
    <a class="nav-button" th:href="@{/login}" aria-label="Sign in to see Schedule" title="Sign in"><i class="bi bi-calendar3" aria-hidden="true"></i><span>Schedule</span></a>
    <a class="nav-button" th:classappend="${active == 'following' ? ' active' : ''}" th:href="@{/login}" aria-label="Sign in to see Following" title="Sign in" th:attr="aria-current=${active == 'following' ? 'page' : null}"><i class="bi bi-heart" aria-hidden="true"></i><span>Following</span></a>
    <a class="nav-button" th:href="@{/login}" aria-label="Sign in" title="Sign in"><i class="bi bi-person" aria-hidden="true"></i><span>Profile</span></a>
</nav>

<nav th:fragment="member(active)" class="floating-nav" aria-label="Member navigation">
    <a class="nav-button" th:classappend="${active == 'home' ? ' active' : ''}" th:href="${storeSlug != null} ? @{/s/{slug}/home(slug=${storeSlug})} : @{/}" aria-label="Home" title="Home" th:attr="aria-current=${active == 'home' ? 'page' : null}"><i class="bi" th:classappend="${active == 'home' ? 'bi-house-fill' : 'bi-house'}" aria-hidden="true"></i><span>Home</span></a>
    <a class="nav-button" th:classappend="${active == 'schedule' ? ' active' : ''}" th:href="${storeSlug != null} ? @{/s/{slug}/schedule(slug=${storeSlug})} : @{/member/schedule}" aria-label="Schedule" title="Schedule" th:attr="aria-current=${active == 'schedule' ? 'page' : null}"><i class="bi" th:classappend="${active == 'schedule' ? 'bi-calendar3-fill' : 'bi-calendar3'}" aria-hidden="true"></i><span>Schedule</span></a>
    <a class="nav-button" th:classappend="${active == 'following' ? ' active' : ''}" th:href="${storeSlug != null} ? @{/s/{slug}/following(slug=${storeSlug})} : @{/member/following}" aria-label="Following" title="Following" th:attr="aria-current=${active == 'following' ? 'page' : null}"><i class="bi" th:classappend="${active == 'following' ? 'bi-heart-fill' : 'bi-heart'}" aria-hidden="true"></i><span>Following</span></a>
    <a class="nav-button" th:classappend="${active == 'profile' ? ' active' : ''}" th:href="${storeSlug != null} ? @{/s/{slug}/account(slug=${storeSlug})} : @{/account}" aria-label="Profile" title="Profile" th:attr="aria-current=${active == 'profile' ? 'page' : null}"><i class="bi" th:classappend="${active == 'profile' ? 'bi-person-fill' : 'bi-person'}" aria-hidden="true"></i><span>Profile</span></a>
</nav>

<nav th:fragment="cast(active)" class="floating-nav cast-nav" aria-label="Cast navigation">
    <a class="nav-button" th:classappend="${active == 'home' ? ' active' : ''}" th:href="@{/}" aria-label="Home" title="Home" th:attr="aria-current=${active == 'home' ? 'page' : null}"><i class="bi" th:classappend="${active == 'home' ? 'bi-house-fill' : 'bi-house'}" aria-hidden="true"></i><span>Home</span></a>
    <a class="nav-button" th:classappend="${active == 'schedule' ? ' active' : ''}" th:href="${castStoreSlug != null} ? @{/s/{slug}/schedule(slug=${castStoreSlug})} : @{/member/schedule}" aria-label="Schedule" title="Schedule" th:attr="aria-current=${active == 'schedule' ? 'page' : null}"><i class="bi" th:classappend="${active == 'schedule' ? 'bi-calendar3-fill' : 'bi-calendar3'}" aria-hidden="true"></i><span>Schedule</span></a>
    <a class="nav-button" th:classappend="${active == 'cast' ? ' active' : ''}" th:href="@{/cast}" aria-label="Cast" title="Cast" th:attr="aria-current=${active == 'cast' ? 'page' : null}"><i class="bi bi-stars" aria-hidden="true"></i><span>Cast</span></a>
    <a class="nav-button" th:classappend="${active == 'cast-profile' ? ' active' : ''}" th:href="@{/cast/public-profile}" aria-label="Cast Profile" title="Cast Profile" th:attr="aria-current=${active == 'cast-profile' ? 'page' : null}"><i class="bi" th:classappend="${active == 'cast-profile' ? 'bi-person-badge-fill' : 'bi-person-badge'}" aria-hidden="true"></i><span>Cast Profile</span></a>
    <a class="nav-button" th:classappend="${active == 'profile' ? ' active' : ''}" th:href="@{/cast/profile}" aria-label="Profile" title="Profile" th:attr="aria-current=${active == 'profile' ? 'page' : null}"><i class="bi" th:classappend="${active == 'profile' ? 'bi-person-fill' : 'bi-person'}" aria-hidden="true"></i><span>Profile</span></a>
</nav>

<nav th:fragment="owner(active)" class="floating-nav owner-nav" aria-label="Owner navigation">
    <a class="nav-button" th:classappend="${active == 'dashboard' ? ' active' : ''}" th:href="@{/owner}" aria-label="Owner Dashboard" title="Dashboard" th:attr="aria-current=${active == 'dashboard' ? 'page' : null}"><i class="bi" th:classappend="${active == 'dashboard' ? 'bi-grid-fill' : 'bi-grid'}" aria-hidden="true"></i><span>Dashboard</span></a>
    <a class="nav-button" th:classappend="${active == 'shifts' ? ' active' : ''}" th:href="@{/owner/shifts}" aria-label="Shifts" title="Shifts" th:attr="aria-current=${active == 'shifts' ? 'page' : null}"><i class="bi" th:classappend="${active == 'shifts' ? 'bi-calendar3-fill' : 'bi-calendar3'}" aria-hidden="true"></i><span>Shifts</span></a>
    <a class="nav-button" th:classappend="${active == 'events' ? ' active' : ''}" th:href="@{/owner/events}" aria-label="Events" title="Events" th:attr="aria-current=${active == 'events' ? 'page' : null}"><i class="bi" th:classappend="${active == 'events' ? 'bi-calendar-event-fill' : 'bi-calendar-event'}" aria-hidden="true"></i><span>Events</span></a>
    <a class="nav-button" th:classappend="${active == 'promotions' ? ' active' : ''}" th:href="@{/owner/promotions}" aria-label="Promotions" title="Promotions" th:attr="aria-current=${active == 'promotions' ? 'page' : null}"><i class="bi" th:classappend="${active == 'promotions' ? 'bi-megaphone-fill' : 'bi-megaphone'}" aria-hidden="true"></i><span>Promos</span></a>
    <a class="nav-button" th:classappend="${active == 'account' ? ' active' : ''}" th:href="@{/account}" aria-label="Account" title="Account" th:attr="aria-current=${active == 'account' ? 'page' : null}"><i class="bi" th:classappend="${active == 'account' ? 'bi-person-fill' : 'bi-person'}" aria-hidden="true"></i><span>Account</span></a>
</nav>
</body>
</html>
