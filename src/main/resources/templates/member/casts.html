<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Discover active Cast profiles on CastFan.">
    <title>Discover Cast | CastFan</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="app-shell">
<header class="app-header">
    <div class="page-container header-content">
        <a class="brand" th:href="@{/}" aria-label="CastFan home">
            <span class="brand-mark" aria-hidden="true"><i class="bi bi-heart-fill"></i></span>
            <span>CastFan</span>
        </a>
        <a class="profile-button" th:href="@{/account}" aria-label="Open account" title="Account">
            <i class="bi bi-person-fill" aria-hidden="true"></i>
        </a>
    </div>
</header>

<main class="page-container directory-content">
    <div class="directory-heading">
        <p class="eyebrow">Member discovery</p>
        <h1>Discover Cast</h1>
        <p>Find active Cast profiles and keep your favorites close.</p>
    </div>

    <div class="directory-grid" th:if="${!castPage.empty}">
        <article class="cast-directory-item" th:each="cast : ${castPage.content}">
            <div class="avatar avatar-large tone-rose cast-directory-avatar">
                <img th:if="${cast.avatarUrl != null}" th:src="${cast.avatarUrl}" th:alt="${cast.stageName}">
                <span th:unless="${cast.avatarUrl != null}" th:text="${cast.initials}">CF</span>
            </div>
            <div class="cast-directory-copy">
                <h2 th:text="${cast.stageName}">Cast name</h2>
                <p th:text="${cast.bio != null ? cast.bio : 'No profile bio yet.'}">Profile bio</p>
            </div>
            <form th:if="${!cast.following}" th:action="@{/member/casts/{id}/follow(id=${cast.id})}" method="post">
                <button class="follow-button" type="submit">
                    <i class="bi bi-plus-lg" aria-hidden="true"></i>
                    <span>Follow</span>
                </button>
            </form>
            <a class="follow-button is-following" th:if="${cast.following}" th:href="@{/member/following}">
                <i class="bi bi-check-lg" aria-hidden="true"></i>
                <span>Following</span>
            </a>
        </article>
    </div>

    <div class="directory-empty" th:if="${castPage.empty}">
        <i class="bi bi-people" aria-hidden="true"></i>
        <h2>No Cast profiles available</h2>
        <p>Visible Cast profiles will appear here.</p>
    </div>

    <nav class="pagination-nav" th:if="${castPage.totalPages > 1}" aria-label="Cast results pages">
        <a class="secondary-button" th:classappend="${castPage.first} ? ' is-disabled'" th:href="@{/member/casts(page=${castPage.number - 1})}" aria-label="Previous page">
            <i class="bi bi-chevron-left" aria-hidden="true"></i>
        </a>
        <span>Page <strong th:text="${castPage.number + 1}">1</strong> of <strong th:text="${castPage.totalPages}">1</strong></span>
        <a class="secondary-button" th:classappend="${castPage.last} ? ' is-disabled'" th:href="@{/member/casts(page=${castPage.number + 1})}" aria-label="Next page">
            <i class="bi bi-chevron-right" aria-hidden="true"></i>
        </a>
    </nav>
</main>

<nav class="bottom-nav" aria-label="Member navigation">
    <div class="bottom-nav-content">
        <a class="nav-item" th:href="@{/}"><i class="bi bi-house" aria-hidden="true"></i><span>Home</span></a>
        <a class="nav-item active" th:href="@{/member/casts}" aria-current="page"><i class="bi bi-search" aria-hidden="true"></i><span>Discover</span></a>
        <a class="nav-item" th:href="@{/member/following}"><i class="bi bi-heart" aria-hidden="true"></i><span>Following</span></a>
        <a class="nav-item" th:href="@{/member/memberships}"><i class="bi bi-star" aria-hidden="true"></i><span>Memberships</span></a>
    </div>
</nav>
</body>
</html>
