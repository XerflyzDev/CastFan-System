<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="View Cast profiles followed by this CastFan member.">
    <title>Following | CastFan</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/ui-foundation.css}" rel="stylesheet">
    <link th:href="@{/css/member-home.css}" rel="stylesheet">
    <link th:href="@{/css/member-following.css}" rel="stylesheet">
</head>
<body>
<main class="concept-stage">
    <section class="phone" aria-label="CastFan Member Following">
        <div class="ambient-top" aria-hidden="true"></div>
        <div class="screen-content following-content">
            <div class="top-actions">
                <a class="wordmark" th:href="@{/}">CastFan</a>
                <a class="round-button" th:href="${storeSlug != null} ? @{/s/{slug}/notifications(slug=${storeSlug})} : @{/member/notifications}" aria-label="Notifications" title="Notifications"><i class="bi bi-bell" aria-hidden="true"></i></a>
            </div>

            <header class="following-heading">
                <p>Your favorites</p>
                <div><h1>Following</h1><span><span th:text="${castList.size()}">0</span> Cast</span></div>
            </header>

            <label class="concept-search following-search" for="following-search" th:if="${!castList.empty}">
                <i class="bi bi-search" aria-hidden="true"></i>
                <input id="following-search" type="search" placeholder="Search followed Cast" autocomplete="off">
                <button type="button" data-clear-following-search aria-label="Clear search" title="Clear search"><i class="bi bi-x-circle-fill" aria-hidden="true"></i></button>
            </label>

            <section class="following-list" aria-label="Followed Cast" th:if="${!castList.empty}">
                <article class="following-card" th:each="cast, castStat : ${castList}" data-following-card th:attr="data-cast-name=${cast.stageName}">
                    <a class="cast-profile-action" th:href="@{/casts/{id}(id=${cast.id})}">
                        <img class="profile-avatar avatar-photo" th:if="${cast.avatarUrl != null}" th:src="${cast.avatarUrl}" th:alt="${cast.stageName}">
                        <span class="profile-avatar" th:unless="${cast.avatarUrl != null}" th:classappend="${castStat.index % 3 == 0 ? 'rose' : (castStat.index % 3 == 1 ? 'lavender' : 'amber')}" th:text="${cast.initials}">MN</span>
                        <span class="following-copy">
                            <span class="name-row"><strong th:text="${cast.stageName}">Mina</strong><small>Followed</small></span>
                            <span th:text="${cast.bio != null ? cast.bio : 'Profile updates from CastFan.'}">Profile bio</span>
                        </span>
                        <i class="bi bi-heart-fill followed-mark" aria-hidden="true"></i>
                    </a>
                    <form th:action="${storeSlug != null} ? @{/s/{slug}/casts/{id}/unfollow(slug=${storeSlug},id=${cast.id})} : @{/member/casts/{id}/unfollow(id=${cast.id})}" method="post">
                        <button class="following-button is-following" type="submit" th:attr="aria-label=${'Unfollow ' + cast.stageName}">
                            <i class="bi bi-heart-fill" aria-hidden="true"></i><span>Following</span>
                        </button>
                    </form>
                </article>
            </section>

            <div class="home-empty following-empty" th:if="${castList.empty}">
                <i class="bi bi-heart" aria-hidden="true"></i>
                <div><strong>No followed Cast yet</strong><span>Discover profiles and keep your favorites close.</span></div>
            </div>
            <p class="following-search-empty" data-following-empty hidden>No followed Cast match your search.</p>

            <a class="discover-action" th:href="${storeSlug != null} ? @{/s/{slug}/casts(slug=${storeSlug})} : @{/member/casts}">
                <i class="bi bi-plus" aria-hidden="true"></i>
                <span><strong>Discover Cast</strong><small>Find more profiles on CastFan</small></span>
                <i class="bi bi-arrow-right" aria-hidden="true"></i>
            </a>
        </div>

        <th:block sec:authorize="hasRole('MEMBER')" th:replace="~{fragments/navigation :: member('following')}"></th:block>
        <th:block sec:authorize="hasRole('CAST')" th:replace="~{fragments/navigation :: cast('')}"></th:block>
        <div class="concept-toast" id="app-toast" role="status" aria-live="polite"></div>
    </section>
</main>
<script th:src="@{/js/member-following.js}" defer></script>
</body>
</html>
