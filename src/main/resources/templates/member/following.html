<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="View Cast profiles followed by this CastFan member.">
    <title>Following | CastFan</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="app-shell">
<header class="app-header">
    <div class="page-container header-content">
        <a class="brand" th:href="@{/}" aria-label="CastFan home">
            <span class="brand-mark" aria-hidden="true"><i class="bi bi-heart-fill"></i></span>
            <span>CastFan</span>
        </a>
        <a class="profile-button" th:href="@{/account}" aria-label="Open account" title="Account">
            <i class="bi bi-person-fill" aria-hidden="true"></i>
        </a>
    </div>
</header>

<main class="page-container directory-content">
    <div class="directory-heading">
        <p class="eyebrow">Your collection</p>
        <h1>Following</h1>
        <p>Cast profiles you want to keep up with.</p>
    </div>

    <div class="directory-grid" th:if="${!castList.empty}">
        <article class="cast-directory-item" th:each="cast : ${castList}">
            <div class="avatar avatar-large tone-rose cast-directory-avatar">
                <img th:if="${cast.avatarUrl != null}" th:src="${cast.avatarUrl}" th:alt="${cast.stageName}">
                <span th:unless="${cast.avatarUrl != null}" th:text="${cast.initials}">CF</span>
            </div>
            <div class="cast-directory-copy">
                <h2 th:text="${cast.stageName}">Cast name</h2>
                <p th:text="${cast.bio != null ? cast.bio : 'No profile bio yet.'}">Profile bio</p>
            </div>
            <form th:action="@{/member/casts/{id}/unfollow(id=${cast.id})}" method="post">
                <button class="follow-button is-following" type="submit">
                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                    <span>Unfollow</span>
                </button>
            </form>
        </article>
    </div>

    <div class="directory-empty" th:if="${castList.empty}">
        <i class="bi bi-heart" aria-hidden="true"></i>
        <h2>No followed Cast yet</h2>
        <p>Discover profiles and follow the Cast you like.</p>
        <a class="primary-button" th:href="@{/member/casts}">Discover Cast</a>
    </div>
</main>

<nav class="bottom-nav" aria-label="Member navigation">
    <div class="bottom-nav-content">
        <a class="nav-item" th:href="@{/}"><i class="bi bi-house" aria-hidden="true"></i><span>Home</span></a>
        <a class="nav-item" th:href="@{/member/casts}"><i class="bi bi-search" aria-hidden="true"></i><span>Discover</span></a>
        <a class="nav-item active" th:href="@{/member/following}" aria-current="page"><i class="bi bi-heart-fill" aria-hidden="true"></i><span>Following</span></a>
        <a class="nav-item" th:href="@{/member/memberships}"><i class="bi bi-star" aria-hidden="true"></i><span>Memberships</span></a>
    </div>
</nav>
</body>
</html>
