<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Stores | CastFan</title><link th:href="@{/css/app.css}" rel="stylesheet"></head><body><main class="phone"><div class="screen-content"><h1>My Stores</h1><p th:if="${#lists.isEmpty(memberships)}">You have not joined a store yet. Scan a store's CastFan QR code to begin.</p><a class="store-card" th:each="membership : ${memberships}" th:href="@{'/s/' + ${membership.store.slug} + '/home'}"><strong th:text="${membership.store.name}">Store</strong><span th:text="${membership.pointsBalance + ' points'}">0 points</span></a></div></main></body></html>
