<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="See updates from followed Cast and upcoming CastFan events.">
    <title>Notifications | CastFan</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/ui-foundation.css}" rel="stylesheet">
    <link th:href="@{/css/member-home.css}" rel="stylesheet">
    <link th:href="@{/css/member-notifications.css}" rel="stylesheet">
</head>
<body>
<main class="concept-stage">
    <section class="phone" aria-label="Member notifications">
        <div class="ambient-top" aria-hidden="true"></div>
        <div class="screen-content notification-content">
            <div class="top-actions"><a class="wordmark" th:href="@{/}">CastFan</a><a class="round-button page-back-button" th:href="@{/}" aria-label="Back to Home" title="Back to Home"><i class="bi bi-arrow-left" aria-hidden="true"></i></a></div>
            <header class="notification-heading"><p>Your activity</p><div><h1>Notifications</h1><span th:text="${notifications.totalCount}">0</span></div></header>

            <section class="notification-section" aria-labelledby="cast-update-heading">
                <div class="section-title"><h2 id="cast-update-heading">Cast updates</h2><a class="notification-section-link" th:href="${storeSlug != null} ? @{/s/{slug}/following(slug=${storeSlug})} : @{/member/following}"><span>Following</span><i class="bi bi-arrow-right" aria-hidden="true"></i></a></div>
                <div class="notification-list" th:if="${!notifications.contentUpdates.empty}">
                    <a class="notification-card" th:each="notice : ${notifications.contentUpdates}" th:classappend="${!notice.accessible} ? 'locked'" th:href="@{/casts/{castId}/content/{contentId}(castId=${notice.castProfileId},contentId=${notice.contentId})}">
                        <img class="notification-avatar" th:if="${notice.castAvatarUrl != null}" th:src="${notice.castAvatarUrl}" th:alt="${notice.castName}">
                        <span class="notification-avatar" th:unless="${notice.castAvatarUrl != null}" th:text="${notice.castInitials}">MN</span>
                        <span class="notification-copy"><small><span th:text="${notice.castName}">Mina</span> · <span th:text="${notice.publishedLabel}">Tue, 14 Oct</span></small><strong th:text="${notice.title}">New update</strong><span th:if="${notice.accessible}" th:text="${notice.bodyPreview}">Preview</span><span class="locked-copy" th:unless="${notice.accessible}"><i class="bi bi-lock-fill" aria-hidden="true"></i><span th:text="${notice.audience}">Members</span></span></span>
                        <i class="bi bi-chevron-right" aria-hidden="true"></i>
                    </a>
                </div>
                <div class="notification-empty" th:if="${notifications.contentUpdates.empty}"><i class="bi bi-heart" aria-hidden="true"></i><div><strong>No Cast updates yet</strong><span>New posts from followed Cast will appear here.</span></div></div>
            </section>

            <section class="notification-section" aria-labelledby="event-notice-heading">
                <div class="section-title"><h2 id="event-notice-heading">Upcoming events</h2></div>
                <div class="notification-list" th:if="${!notifications.upcomingEvents.empty}">
                    <a class="notification-card event-notification" th:each="event : ${notifications.upcomingEvents}" th:href="@{/events/{id}(id=${event.eventId})}">
                        <img th:if="${event.imageUrl != null}" th:src="${event.imageUrl}" th:alt="${event.title}">
                        <span class="event-icon" th:unless="${event.imageUrl != null}"><i class="bi bi-calendar-event" aria-hidden="true"></i></span>
                        <span class="notification-copy"><small th:text="${event.storeName}">CastFan</small><strong th:text="${event.title}">Event</strong><span><span th:text="${event.dateLabel}">Fri, 16 Oct</span> · <span th:text="${event.timeLabel}">18:00</span></span></span>
                        <i class="bi bi-chevron-right" aria-hidden="true"></i>
                    </a>
                </div>
                <div class="notification-empty" th:if="${notifications.upcomingEvents.empty}"><i class="bi bi-calendar2" aria-hidden="true"></i><div><strong>No upcoming events</strong><span>Published events will appear here.</span></div></div>
            </section>
        </div>
        <th:block sec:authorize="hasRole('MEMBER')" th:replace="~{fragments/navigation :: member('home')}"></th:block>
        <th:block sec:authorize="hasRole('CAST')" th:replace="~{fragments/navigation :: cast('home')}"></th:block>
    </section>
</main>
<script th:src="@{/js/member-profile.js}" defer></script>
</body>
</html>
