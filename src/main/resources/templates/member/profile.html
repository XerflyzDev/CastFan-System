<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Edit your CastFan Member profile.">
    <title>Edit Profile | CastFan</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/member-home.css}" rel="stylesheet">
    <link th:href="@{/css/member-profile.css}" rel="stylesheet">
</head>
<body>
<main class="concept-stage">
    <section class="phone member-edit-page" aria-label="Member profile settings">
        <div class="ambient-top" aria-hidden="true"></div>
        <div class="screen-content profile-content">
            <div class="top-actions"><a class="wordmark" th:href="@{/}">CastFan</a><a class="round-button page-back-button" th:href="@{/account}" aria-label="Back to Profile" title="Back to Profile"><i class="bi bi-arrow-left" aria-hidden="true"></i></a></div>
            <header class="profile-heading"><p>Profile settings</p><h1>Edit profile</h1></header>

            <div class="profile-alert success" th:if="${param.saved}" role="status"><i class="bi bi-check-circle" aria-hidden="true"></i>Profile saved.</div>

            <section class="profile-form-card" aria-labelledby="member-profile-form-heading">
                <form class="member-profile-form" th:action="@{/member/profile}" th:object="${form}" method="post" enctype="multipart/form-data">
                    <div class="edit-profile-summary">
                        <img class="member-avatar member-avatar-photo" th:if="${profile.avatarUrl != null}" th:src="${profile.avatarUrl}" th:alt="${profile.displayName}">
                        <span class="member-avatar" th:unless="${profile.avatarUrl != null}" th:text="${profile.initials}">AR</span>
                        <span><strong th:text="${profile.displayName}">Member</strong><small>Member profile</small></span>
                    </div>
                    <div class="profile-section-title edit-form-title"><div><small>Public information</small><h2 id="member-profile-form-heading">Profile details</h2></div></div>
                    <div class="profile-alert error" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}">Profile error</div>
                    <label><span>Display name</span><input type="text" th:field="*{displayName}" maxlength="80" required><small class="field-error" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}">Name error</small></label>
                    <label><span>Bio</span><textarea th:field="*{bio}" maxlength="500" rows="4" placeholder="Tell Cast and other Members a little about you"></textarea><small class="field-error" th:if="${#fields.hasErrors('bio')}" th:errors="*{bio}">Bio error</small></label>
                    <label class="media-upload"><span>Profile photo <small>Optional</small></span><input type="file" name="image" accept="image/jpeg,image/png,image/webp" data-image-input><input type="hidden" th:field="*{removeImage}" data-image-remove><span class="media-picker"><img th:if="${profile.avatarUrl != null}" th:src="${profile.avatarUrl}" alt="Current profile photo" data-image-preview><img th:unless="${profile.avatarUrl != null}" alt="Selected profile photo preview" data-image-preview hidden><i class="bi bi-cloud-arrow-up" aria-hidden="true"></i><span><strong data-image-name th:text="${profile.avatarUrl != null ? 'Replace photo' : 'Choose photo'}">Choose photo</strong><small>JPG, PNG, or WebP · Maximum 2 MB</small></span></span></label>
                    <button class="media-clear" type="button" data-image-clear th:hidden="${profile.avatarUrl == null}"><i class="bi bi-x-circle" aria-hidden="true"></i>Clear photo</button>
                    <input type="hidden" th:field="*{castUpdateNotifications}">
                    <input type="hidden" th:field="*{eventNotifications}">
                    <button class="save-profile-button" type="submit"><i class="bi bi-check2" aria-hidden="true"></i>Save profile</button>
                </form>
            </section>
        </div>
        <nav th:replace="~{fragments/navigation :: member('profile')}"></nav>
    </section>
</main>
<script th:src="@{/js/member-profile.js}" defer></script>
</body>
</html>
