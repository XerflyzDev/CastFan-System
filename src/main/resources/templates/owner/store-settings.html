<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Store settings | CastFan</title><link th:href="@{/css/app.css}" rel="stylesheet"></head><body><main class="phone"><div class="screen-content owner-content"><a th:href="@{/owner}">Back</a><h1>Store settings</h1><div class="form-alert success" th:if="${param.saved}">Store details saved.</div><form class="auth-form" th:action="@{/owner/store/settings}" th:object="${form}" method="post"><label class="form-field"><span class="field-label">Store name</span><input th:field="*{name}" required maxlength="120"><span th:errors="*{name}"></span></label><label class="form-field"><span class="field-label">Description</span><textarea th:field="*{description}" maxlength="1000"></textarea></label><label class="form-field"><span class="field-label">Address</span><textarea th:field="*{address}" maxlength="500" required></textarea></label><label class="form-field"><span class="field-label">Permanent store URL</span><input th:value="${'/s/' + store.slug}" readonly></label><button class="primary-button" type="submit">Save changes</button></form><section><h2>Store QR</h2><img th:src="@{/owner/store/qr}" alt="QR code for this store" width="240" height="240"><p><a class="primary-button" th:href="@{/owner/store/qr(download=true)}">Download QR</a></p></section></div></main></body></html>
