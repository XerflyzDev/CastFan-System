<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Manage Cast schedules and profile activity.">
    <title>Cast workspace | CastFan</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="workspace-page">
<header class="workspace-header">
    <div class="workspace-container workspace-header-content">
        <a class="brand" th:href="@{/cast}" aria-label="Cast workspace home">
            <span class="brand-mark" aria-hidden="true"><i class="bi bi-heart-fill"></i></span>
            <span>CastFan</span>
        </a>
        <a class="icon-button" th:href="@{/account}" aria-label="Open account" title="Account">
            <i class="bi bi-person-fill" aria-hidden="true"></i>
        </a>
    </div>
</header>
<main class="workspace-container workspace-content">
    <div class="workspace-title">
        <div>
            <p class="eyebrow">Cast workspace</p>
            <h1>Welcome, <span th:text="${account.displayName}">Cast</span></h1>
        </div>
        <span class="role-badge">CAST</span>
    </div>
    <div class="workspace-grid">
        <section class="workspace-section" aria-labelledby="shift-heading">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">Schedule</p>
                    <h2 id="shift-heading">Upcoming shifts</h2>
                </div>
            </div>
            <div class="workspace-empty">
                <i class="bi bi-calendar3" aria-hidden="true"></i>
                <p>No upcoming shifts.</p>
            </div>
        </section>
        <section class="workspace-section" aria-labelledby="profile-heading">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">Profile</p>
                    <h2 id="profile-heading">Visibility</h2>
                </div>
            </div>
            <dl class="workspace-facts">
                <div><dt>Status</dt><dd>Private</dd></div>
                <div><dt>Account</dt><dd th:text="${account.email}">cast@example.com</dd></div>
            </dl>
            <a class="secondary-button workspace-action" th:href="@{/cast/tiers}">Manage membership tiers</a>
        </section>
    </div>
</main>
</body>
</html>
